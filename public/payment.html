<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    =========================================================================
    10X Event Hub — Payment Page
    =========================================================================
    PURPOSE : Displays a fixed UPI QR code for the user to scan and pay.
              After payment, user enters the UPI Reference / Transaction ID.
    FLOW    : Shows static QR → user pays via GPay/PhonePe/Paytm →
              enters txn ID → POST /api/register → stores ticket data →
              redirects to ticket.html.
    NOTE    : The QR image (qr_static.png) must be placed in /public.
    =========================================================================
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Complete your event registration payment via UPI. Scan the QR code and enter your transaction ID.">
  <title>10X Event Hub | Checkout</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <style>
    /**
     * Page-specific styles for the payment header strip.
     * Extends the global design system.
     */
    .checkout-header {
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      padding: var(--space-lg) var(--space-2xl);
      text-align: center;
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      margin: calc(-1 * var(--space-2xl));
      margin-bottom: var(--space-xl);
      /* Extend to card edges */
      width: calc(100% + var(--space-2xl) * 2);
      position: relative;
      left: calc(-1 * var(--space-2xl));
    }

    .checkout-header h2 {
      font-size: var(--fs-md);
      font-weight: 700;
      color: white;
      margin-bottom: 4px;
    }

    .checkout-header p {
      font-size: var(--fs-xs);
      color: rgba(255, 255, 255, 0.7);
    }

    .payment-methods {
      display: flex;
      justify-content: center;
      gap: var(--space-md);
      margin-top: var(--space-sm);
    }

    .payment-methods span {
      font-size: var(--fs-xs);
      color: rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.15);
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <canvas class="particles-canvas" id="particlesCanvas"></canvas>

  <!-- ======================== PAYMENT CARD ======================== -->
  <div class="glass-card" id="payCard">

    <!-- Coloured header strip -->
    <div class="checkout-header">
      <h2>Complete Payment</h2>
      <p>Scan the QR code using any UPI app</p>
      <div class="payment-methods">
        <span>GPay</span>
        <span>PhonePe</span>
        <span>Paytm</span>
      </div>
    </div>

    <!-- Step indicator -->
    <div class="step-badge" style="margin-top: var(--space-sm);">Step 2 of 2</div>

    <!-- Static QR Code -->
    <div class="qr-frame">
      <img
        src="qr_static.png"
        alt="UPI Payment QR Code"
        onerror="this.src='https://placehold.co/200x200/1e1b4b/6c63ff?text=QR+Code'"
      />
      <p>Scan &amp; pay the event registration fee</p>
    </div>

    <!-- Transaction ID Form -->
    <form id="payForm" novalidate>
      <div class="form-group">
        <label for="txnId">UPI Reference ID</label>
        <input
          type="text"
          id="txnId"
          placeholder="e.g. 302145678901"
          required
          maxlength="20"
          autocomplete="off"
        />
      </div>

      <button type="submit" class="btn btn-success" id="submitBtn">
        Confirm Payment
      </button>

      <!-- Error alert -->
      <div id="errorMsg" class="alert alert-error" role="alert"></div>
    </form>
  </div>

  <!-- ======================== SCRIPTS ======================== -->
  <script>
    /**
     * Particles animation (consistent across all pages).
     */
    (function initParticles() {
      const canvas = document.getElementById('particlesCanvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      const COUNT = 60;
      function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
      function create() {
        return {
          x: Math.random() * canvas.width, y: Math.random() * canvas.height,
          r: Math.random() * 1.5 + 0.5,
          dx: (Math.random() - 0.5) * 0.4, dy: (Math.random() - 0.5) * 0.4,
          o: Math.random() * 0.5 + 0.1
        };
      }
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.dx; p.y += p.dy;
          if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
          if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(108,99,255,${p.o})`; ctx.fill();
        });
        requestAnimationFrame(draw);
      }
      resize(); addEventListener('resize', resize);
      for (let i = 0; i < COUNT; i++) particles.push(create());
      draw();
    })();

    /**
     * Payment Form Handler
     * - Collects all registration data from sessionStorage.
     * - Sends POST /api/register with name, email, phone, and txnId.
     * - On success, stores ticket QR and data, then redirects to ticket.html.
     */
    document.getElementById('payForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn      = document.getElementById('submitBtn');
      const errorMsg = document.getElementById('errorMsg');
      const txnId    = document.getElementById('txnId').value.trim();

      errorMsg.style.display = 'none';

      if (!txnId) {
        errorMsg.innerText = 'Please enter a valid UPI Reference ID.';
        errorMsg.style.display = 'block';
        return;
      }

      // Build payload from sessionStorage + form
      const payload = {
        email: sessionStorage.getItem('klu_user_email'),
        name:  sessionStorage.getItem('reg_name'),
        phone: sessionStorage.getItem('reg_phone'),
        txnId: txnId
      };

      // Guard: ensure all data is present
      if (!payload.email || !payload.name || !payload.phone) {
        window.location.href = 'index.html';
        return;
      }

      btn.classList.add('loading');
      btn.disabled = true;

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (data.success) {
          // Store ticket data for the ticket page
          sessionStorage.setItem('ticket_qr', data.qrCodeUrl);
          sessionStorage.setItem('ticket_data', JSON.stringify(payload));
          window.location.href = 'ticket.html';
        } else {
          throw new Error(data.message || 'Payment verification failed.');
        }
      } catch (err) {
        errorMsg.innerText = err.message;
        errorMsg.style.display = 'block';
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
