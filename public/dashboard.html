<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10X Event Hub | Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  
  <script>
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);

    // Protect route
    if (!sessionStorage.getItem('klu_user_email')) {
      window.location.href = 'index.html';
    }
  </script>
</head>
<body>
  
  <nav class="navbar">
    <a href="dashboard.html" class="brand-logo">10X Event Hub</a>
    <div class="nav-actions">
      <span class="user-badge" id="userEmailBadge"></span>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle Dark Mode">
        <svg id="moonIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <svg id="sunIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      </button>
      <button id="logoutBtn" class="btn btn-secondary" style="padding: 8px 16px; width: auto; font-size: 0.875rem;">Logout</button>
    </div>
  </nav>

  <div class="container slide-up">
    <h2>Upcoming Events</h2>
    <p>Select an event below to begin team registration.</p>

    <div id="eventsGrid" class="grid mt-4">
      <!-- Events will be populated here -->
      <div style="text-align: center; width: 100%; color: var(--text-secondary);">Loading events...</div>
    </div>
  </div>

  <script>
    document.getElementById('userEmailBadge').innerText = sessionStorage.getItem('klu_user_email');

    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem('klu_user_email');
      window.location.href = 'index.html';
    });

    const themeToggle = document.getElementById('themeToggle');
    const moonIcon = document.getElementById('moonIcon');
    const sunIcon = document.getElementById('sunIcon');
    
    function updateIcons(theme) {
      if (theme === 'dark') {
        moonIcon.classList.add('hidden');
        sunIcon.classList.remove('hidden');
      } else {
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      }
    }
    
    updateIcons(savedTheme);
    
    themeToggle.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateIcons(newTheme);
    });

    // Fetch and display events
    async function loadEvents() {
      const grid = document.getElementById('eventsGrid');
      try {
        const res = await fetch('/api/events');
        if (!res.ok) throw new Error('Failed to load events');
        
        const data = await res.json();
        const events = data.events || [];

        if (events.length === 0) {
          grid.innerHTML = '<div style="text-align: center; width: 100%; grid-column: 1 / -1; color: var(--text-secondary); padding: 40px; background: var(--surface-color); border-radius: var(--radius-md); border: 1px solid var(--border-color);">No upcoming events at the moment. Please check back later!</div>';
          return;
        }

        grid.innerHTML = events.map(event => `
          <div class="event-card" onclick="window.location.href='register.html?eventId=${event.id}'">
            <h3>${event.title}</h3>
            <div class="meta">
              <div>📅 ${event.date}</div>
              <div class="mt-2">💰 ₹${event.fee} per team</div>
            </div>
            <button class="btn btn-primary" style="padding: 10px; font-size: 0.875rem;">Register Team</button>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
        grid.innerHTML = '<div class="alert alert-error" style="grid-column: 1 / -1;">Unable to load events. Please try again later.</div>';
      }
    }

    loadEvents();
  </script>
</body>
</html>
