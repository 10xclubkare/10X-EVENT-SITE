<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10X Event Hub | Controller Dashboard</title>
  <link rel="stylesheet" href="styles.css">

  <script>
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);

    // Protect route
    if (!sessionStorage.getItem('klu_admin_token')) {
      window.location.href = 'controller.html';
    }
  </script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>

  <nav class="navbar">
    <a href="/admin" class="brand-logo">10X Controller</a>
    <div class="nav-actions">
      <span class="user-badge" style="background-color: rgba(255, 59, 48, 0.1); color: var(--error-color);">Admin</span>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle Dark Mode">
        <svg id="moonIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" class="hidden">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg id="sunIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" class="hidden">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
      <button id="logoutBtn" class="btn btn-secondary"
        style="padding: 8px 16px; width: auto; font-size: 0.875rem;">Exit</button>
    </div>
  </nav>

  <div class="container slide-up" style="max-width: 900px;">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
      <h2>System Overview</h2>
      <div style="display: flex; gap: 12px; flex-wrap: wrap;">
        <button id="openScannerBtn" class="btn btn-secondary" style="width: auto;">📷 QR Scanner</button>
        <a href="/api/registrations/download" class="btn btn-primary" style="width: auto;" target="_blank">📥 Download
          Master Data</a>
      </div>
    </div>

    <!-- Create Event Card -->
    <div class="card" style="max-width: 100%; margin-bottom: 40px;">
      <h3>Create New Event</h3>
      <p>Publish a new event to the student dashboard.</p>

      <form id="createEventForm" class="mt-4">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
          <div class="form-group">
            <label for="eventTitle">Event Title</label>
            <input type="text" id="eventTitle" required placeholder="e.g. Farm Fusion Hackathon">
          </div>
          <div class="form-group">
            <label for="eventDate">Date & Time</label>
            <input type="text" id="eventDate" required placeholder="e.g. Sept 25, 10:00 AM">
          </div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
          <div class="form-group">
            <label for="eventFee">Team Registration Fee (₹)</label>
            <input type="number" id="eventFee" required placeholder="500">
          </div>
          <div class="form-group">
            <label for="eventMax">Max Teams</label>
            <input type="number" id="eventMax" required placeholder="50">
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="createBtn">Publish Event</button>
        <div id="statusMsg" class="mt-4" style="display: none;"></div>
      </form>
    </div>

    <!-- QR Scanner Modal -->
    <div id="scannerModal"
      style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px);">
      <div class="card" style="width: 90%; max-width: 450px; position: relative;">
        <button id="closeScannerBtn"
          style="position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-color);">&times;</button>
        <h3 style="margin-bottom: 16px; text-align: center;">Verify Digital Pass</h3>

        <!-- Scanner View -->
        <div id="scannerView">
          <div id="qr-reader"
            style="width: 100%; margin-bottom: 16px; border-radius: 12px; overflow: hidden; background: white;"></div>
          <p style="text-align: center; color: var(--text-secondary); font-size: 0.875rem;">Align the team's QR code
            within the frame to verify registration.</p>
        </div>

        <!-- Result View -->
        <div id="scannerResult" style="display: none; text-align: center;">
          <div id="resultIcon" style="font-size: 3rem; margin-bottom: 16px;"></div>
          <h2 id="resultTitle" style="margin-bottom: 12px;"></h2>
          <div id="resultDetails"
            style="background: rgba(0,0,0,0.2); padding: 16px; border-radius: 8px; text-align: left; margin-bottom: 24px; font-size: 0.95rem; line-height: 1.6;">
          </div>
          <button id="scanAgainBtn" class="btn btn-primary">Scan Another Pass</button>
        </div>
      </div>
    </div>

    <!-- Existing Events -->
    <h3>Active Events</h3>
    <div id="eventsGrid" class="grid mt-4">
      <div style="text-align: center; width: 100%; color: var(--text-secondary);">Loading events...</div>
    </div>

  </div>

  <script>
    // Theme toggler
    const themeToggle = document.getElementById('themeToggle');
    const moonIcon = document.getElementById('moonIcon');
    const sunIcon = document.getElementById('sunIcon');

    function updateIcons(theme) {
      if (theme === 'dark') {
        moonIcon.classList.add('hidden');
        sunIcon.classList.remove('hidden');
      } else {
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
      }
    }
    updateIcons(savedTheme);

    themeToggle.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateIcons(newTheme);
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem('klu_admin_token');
      window.location.href = 'controller.html';
    });

    // Create Event
    document.getElementById('createEventForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('createBtn');
      const statusMsg = document.getElementById('statusMsg');

      const title = document.getElementById('eventTitle').value;
      const date = document.getElementById('eventDate').value;
      const fee = document.getElementById('eventFee').value;
      const max = document.getElementById('eventMax').value;

      btn.classList.add('loading');
      btn.disabled = true;

      try {
        const token = sessionStorage.getItem('klu_admin_token');
        const res = await fetch('/api/events', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ title, date, fee, max })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => null);
          throw new Error(errData?.message || 'Failed to create event');
        }

        statusMsg.className = 'alert alert-success mt-4';
        statusMsg.innerText = 'Event created successfully!';
        statusMsg.style.display = 'block';

        document.getElementById('createEventForm').reset();
        loadEvents(); // refresh the grid
      } catch (err) {
        statusMsg.className = 'alert alert-error mt-4';
        statusMsg.innerText = err.message;
        statusMsg.style.display = 'block';
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
        setTimeout(() => { statusMsg.style.display = 'none'; }, 3000);
      }
    });

    // Fetch Events
    async function loadEvents() {
      const grid = document.getElementById('eventsGrid');
      try {
        const res = await fetch('/api/events');
        if (!res.ok) throw new Error('Failed to load events');

        const data = await res.json();
        const events = data.events || [];

        if (events.length === 0) {
          grid.innerHTML = '<div style="text-align: center; width: 100%; grid-column: 1 / -1; color: var(--text-secondary); padding: 40px; border: 1px dashed var(--border-color); border-radius: var(--radius-md);">No active events. Create one above.</div>';
          return;
        }

        grid.innerHTML = events.map(event => `
          <div class="event-card">
            <h3>${event.title}</h3>
            <div class="meta">
              <div>📅 ${event.date}</div>
              <div>💰 ₹${event.fee} per team</div>
              <div class="mt-2">👥 Max Teams: ${event.max}</div>
            </div>
            <div class="badge required" style="text-align: center; width: max-content;">Active</div>
          </div>
        `).join('');
      } catch (err) {
        grid.innerHTML = '<div class="alert alert-error" style="grid-column: 1 / -1;">Unable to load events.</div>';
      }
    }

    loadEvents();

    // ---------------------------------------------------------
    // QR Code Scanner Logic
    // ---------------------------------------------------------
    const scannerModal = document.getElementById('scannerModal');
    const openScannerBtn = document.getElementById('openScannerBtn');
    const closeScannerBtn = document.getElementById('closeScannerBtn');
    const scannerView = document.getElementById('scannerView');
    const scannerResult = document.getElementById('scannerResult');
    const scanAgainBtn = document.getElementById('scanAgainBtn');

    let html5QrcodeScanner;

    function renderResult(success, data, msg) {
      scannerView.style.display = 'none';
      scannerResult.style.display = 'block';
      const icon = document.getElementById('resultIcon');
      const title = document.getElementById('resultTitle');
      const details = document.getElementById('resultDetails');

      if (success && data.registered) {
        icon.innerHTML = '✅';
        title.innerText = 'TEAM VERIFIED';
        title.style.color = '#10b981';

        const membersHtml = data.team.members.map((m, i) => `<div>${i + 1}. ${m}</div>`).join('');
        details.innerHTML = `
          <strong>Team Name:</strong> ${data.team.name}<br>
          <strong>Team ID:</strong> ${data.team.id}<br><br>
          <strong>Members:</strong><br>
          ${membersHtml}<br><br>
          <strong>Registration Status:</strong> <span class="badge required" style="background: rgba(16,185,129,0.1); color: #10b981; border: 1px solid #10b981;">REGISTERED</span>
        `;
      } else {
        icon.innerHTML = '❌';
        title.innerText = 'INVALID PASS';
        title.style.color = '#ef4444';
        details.innerHTML = `<div style="text-align:center;">${msg || 'This QR code does not belong to a registered team.'}</div>`;
      }
    }

    async function onScanSuccess(decodedText, decodedResult) {
      if (html5QrcodeScanner) html5QrcodeScanner.pause();

      try {
        const qrData = JSON.parse(decodedText);
        if (!qrData.txnId) throw new Error('Invalid Format');

        const token = sessionStorage.getItem('klu_admin_token');
        const res = await fetch('/api/verify-team', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ txnId: qrData.txnId })
        });

        const data = await res.json();
        renderResult(data.success, data, data.message);
      } catch (err) {
        renderResult(false, null, 'Invalid QR Code structure or missing internal transaction reference.');
      }
    }

    function initScanner() {
      scannerView.style.display = 'block';
      scannerResult.style.display = 'none';

      if (!html5QrcodeScanner) {
        // Only load standard QR codes quickly
        html5QrcodeScanner = new Html5QrcodeScanner("qr-reader", { fps: 10, qrbox: { width: 250, height: 250 } }, false);
        html5QrcodeScanner.render(onScanSuccess, () => { });
      } else {
        html5QrcodeScanner.resume();
      }
    }

    openScannerBtn.addEventListener('click', () => {
      scannerModal.style.display = 'flex';
      initScanner();
    });

    closeScannerBtn.addEventListener('click', () => {
      scannerModal.style.display = 'none';
      if (html5QrcodeScanner) {
        try { html5QrcodeScanner.pause(); } catch (e) { }
      }
    });

    scanAgainBtn.addEventListener('click', () => {
      scannerView.style.display = 'block';
      scannerResult.style.display = 'none';
      if (html5QrcodeScanner) {
        try { html5QrcodeScanner.resume(); } catch (e) { }
      }
    });
  </script>
</body>

</html>
