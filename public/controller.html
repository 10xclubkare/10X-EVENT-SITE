<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10X Event Hub | Controller</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>
<body>
  
  <div class="container slide-up" style="max-width: 400px; margin-top: 10vh;">
    <div class="card text-center">
      <div class="badge required" style="display: inline-block; margin-bottom: 16px;">Controller Access</div>
      <h1 style="font-size: 1.5rem; margin-bottom: 24px;">Admin Authentication</h1>
      
      <form id="controllerForm" novalidate>
        <div class="form-group">
          <label for="passcode">Access Passcode</label>
          <input type="password" id="passcode" required autocomplete="current-password" placeholder="Enter secure passcode">
        </div>
        
        <button type="submit" class="btn btn-primary" id="loginBtn">Unlock System</button>
        <div id="errorMsg" class="alert alert-error mt-4" style="display: none;" role="alert"></div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('controllerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const passcode = document.getElementById('passcode').value;
      const errorMsg = document.getElementById('errorMsg');
      const btn = document.getElementById('loginBtn');
      
      errorMsg.style.display = 'none';
      btn.classList.add('loading');
      btn.disabled = true;

      try {
        const res = await fetch('/api/controller/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passcode })
        });
        
        const data = await res.json();
        if (data.success) {
          sessionStorage.setItem('klu_admin_token', data.token);
          window.location.href = 'controller-dashboard.html';
        } else {
          throw new Error('Invalid passcode');
        }
      } catch (err) {
        errorMsg.innerText = err.message;
        errorMsg.style.display = 'block';
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
