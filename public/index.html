<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    =========================================================================
    10X Event Hub — Login Page
    =========================================================================
    PURPOSE : Authenticates students using their KLU academic email.
    FLOW    : User enters email → client validates @klu.ac.in domain →
              server confirms → redirects to register.html.
    SECURITY: Domain-restricted to @klu.ac.in emails only.
    =========================================================================
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KLU 10X Club Event Hub – Secure login portal for KL University students to register for campus events.">
  <title>10X Event Hub | Student Login</title>

  <!-- Google Font: Outfit — geometric sans-serif for premium feel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Shared Design System -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Particle animation canvas (rendered by JS) -->
  <canvas class="particles-canvas" id="particlesCanvas"></canvas>

  <!-- ======================== LOGIN CARD ======================== -->
  <div class="glass-card" id="loginCard">

    <!-- Branding -->
    <div class="brand">
      <div class="brand-logo">10X</div>
      <h1>Event Hub</h1>
      <p>Sign in with your KLU academic email to access exclusive campus events.</p>
    </div>

    <!-- Login Controls -->
    <div style="text-align: center;">
      <button class="btn btn-primary" id="googleLoginBtn" style="display: flex; align-items: center; justify-content: center; gap: 10px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </button>

      <!-- Error alert (hidden by default) -->
      <div id="errorMsg" class="alert alert-error" role="alert"></div>
    </div>
  </div>

  <!-- ======================== SCRIPTS ======================== -->
  <script>
    /**
     * --------------------------------------------------------------------
     * Floating Particles — lightweight canvas animation
     * --------------------------------------------------------------------
     */
    (function initParticles() {
      const canvas = document.getElementById('particlesCanvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      const PARTICLE_COUNT = 60;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function createParticle() {
        return {
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.5 + 0.5,
          dx: (Math.random() - 0.5) * 0.4,
          dy: (Math.random() - 0.5) * 0.4,
          opacity: Math.random() * 0.5 + 0.1
        };
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.dx;
          p.y += p.dy;
          if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
          if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(108, 99, 255, ${p.opacity})`;
          ctx.fill();
        });
        requestAnimationFrame(animate);
      }

      resize();
      window.addEventListener('resize', resize);
      for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(createParticle());
      animate();
    })();
  </script>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDMwHy3Hf9qreuY4tVKO8no5-tOTj8Vv44",
      authDomain: "x-club-856c2.firebaseapp.com",
      projectId: "x-club-856c2",
      storageBucket: "x-club-856c2.firebasestorage.app",
      messagingSenderId: "779560119861",
      appId: "1:779560119861:web:b6ab42b6f03172a87c8b7c",
      measurementId: "G-HYTTPR3R9Z"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);

    /**
     * Google OAuth Provider Configuration
     * ------------------------------------
     * - client_id : GCP OAuth 2.0 Client ID (public, safe for frontend)
     * - hd        : Hosted domain hint — tells Google's login screen to
     *               default to @klu.ac.in accounts. This is a UI hint only;
     *               the actual domain enforcement happens after sign-in below.
     *
     * NOTE: The Client Secret (GOCSPX-...) must NEVER be placed in frontend
     *       code. It is configured in:
     *       Firebase Console → Authentication → Sign-in method → Google
     */
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({
      client_id: '1094391287137-iglk30ai0j94eif66hb1kvegqptqob2v.apps.googleusercontent.com',
      hd: 'klu.ac.in'
    });

    document.getElementById('googleLoginBtn').addEventListener('click', async () => {
      const errorMsg = document.getElementById('errorMsg');
      const btn = document.getElementById('googleLoginBtn');
      
      errorMsg.style.display = 'none';
      btn.classList.add('loading');
      btn.disabled = true;

      try {
        const result = await signInWithPopup(auth, provider);
        const email = result.user.email.toLowerCase();

        // Verify the domain
        if (!email.endsWith('@klu.ac.in')) {
          // If they used a wrong email despite the hint, sign them out immediately
          await signOut(auth);
          throw new Error('Access denied. Please use your @klu.ac.in academic email.');
        }

        // Domain is valid, verify with our server (optional, but good for consistency)
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        
        const data = await res.json();
        if (data.success) {
          sessionStorage.setItem('klu_user_email', email);
          window.location.href = 'register.html';
        } else {
          await signOut(auth);
          throw new Error(data.message || 'Server verification failed.');
        }
      } catch (err) {
        errorMsg.innerText = err.message || 'Authentication failed. Please try again.';
        errorMsg.style.display = 'block';
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
